# Application Name
spring.application.name=auth-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=db_user
spring.datasource.password=db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
# spring.redis.password=your_redis_password (uncomment if you have a password)

# MyBatis Configuration
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Server Port (Optional - default is 8080)
# server.port=8080

# JWT Configuration (Defaults are hardcoded in JwtUtils if these are commented out)
# app.jwtSecret=your-super-secret-key-which-is-long-enough-and-base64-encoded
# app.jwtExpirationMs=86400000
